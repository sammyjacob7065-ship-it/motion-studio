name: Render motion video

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Job id (made by the Telegram bot)"
        required: true

concurrency:
  group: motion-render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: motion-studio
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: System packages (ffmpeg, browser libraries)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2

      - name: Python packages
        run: pip install -r pipeline/requirements.txt

      - name: Engine packages and browser
        working-directory: motion-studio/engine
        run: |
          npm install --no-audit --no-fund
          npx remotion browser ensure

      - name: Make the video
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_BUCKET: ${{ secrets.SUPABASE_BUCKET }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MOTION_TG_TOKEN: ${{ secrets.MOTION_TG_TOKEN }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          TTS_URL: ${{ secrets.TTS_URL }}
          TTS_VOICE: ${{ secrets.TTS_VOICE }}
          DIRECTOR_MODEL: ${{ secrets.DIRECTOR_MODEL }}
          VISION_MODEL: ${{ secrets.VISION_MODEL }}
        run: python pipeline/run.py "${{ inputs.job_id }}"

      - name: Keep the timeline for debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: job-${{ inputs.job_id }}
          path: motion-studio/work/${{ inputs.job_id }}/timeline.json
          if-no-files-found: ignore
          retention-days: 7
