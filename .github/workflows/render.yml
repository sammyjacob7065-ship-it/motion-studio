name: Render motion video

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Job id (made by the Telegram bot)"
        required: true

concurrency:
  group: motion-render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Find the project folder (works however the files were uploaded)
        run: |
          F=$(find . -path ./node_modules -prune -o -path '*/pipeline/run.py' -print | head -1)
          if [ -z "$F" ]; then
            echo "::error::pipeline/run.py was not found in the repo. These are the folders I can see:"
            find . -maxdepth 3 -not -path './.git*' | head -60
            exit 1
          fi
          ROOT=$(dirname "$(dirname "$F")")
          echo "Project folder: $ROOT"
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: System packages (ffmpeg, browser libraries)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2

      - name: Python packages
        working-directory: ${{ env.ROOT }}
        run: |
          pip install "requests>=2.31" "pillow>=10.0"
          if [ -f pipeline/requirements.txt ]; then pip install -r pipeline/requirements.txt; fi

      - name: Engine packages and browser
        working-directory: ${{ env.ROOT }}/engine
        run: |
          npm install --no-audit --no-fund
          npx remotion browser ensure

      - name: Make the video
        working-directory: ${{ env.ROOT }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_BUCKET: ${{ secrets.SUPABASE_BUCKET }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
          GROQ_API_KEY_4: ${{ secrets.GROQ_API_KEY_4 }}
          GROQ_API_KEY_5: ${{ secrets.GROQ_API_KEY_5 }}
          GROQ_API_KEY_6: ${{ secrets.GROQ_API_KEY_6 }}
          MOTION_TG_TOKEN: ${{ secrets.MOTION_TG_TOKEN }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          TTS_URL: ${{ secrets.TTS_URL }}
          TTS_VOICE: ${{ secrets.TTS_VOICE }}
          DIRECTOR_MODEL: ${{ secrets.DIRECTOR_MODEL }}
          VISION_MODEL: ${{ secrets.VISION_MODEL }}
        run: python pipeline/run.py "${{ inputs.job_id }}"

      - name: Keep the timeline for debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: job-${{ inputs.job_id }}
          path: ${{ env.ROOT }}/work/${{ inputs.job_id }}/timeline.json
          if-no-files-found: ignore
          retention-days: 7
